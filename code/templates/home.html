<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ML Insight Lab</title>
  <link rel="icon" href="/static/logo.png" type="image/png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    // Tailwind dark mode setup
    tailwind.config = {
      darkMode: 'class',
    };
  </script>
</head>
<body class="flex h-screen bg-gray-100 text-gray-800 dark:bg-gray-900 dark:text-gray-100">

  <!-- Sidebar -->
  <aside class="w-64 bg-white dark:bg-gray-800 shadow-lg flex flex-col justify-between">
    <div>
      <div class="flex items-center gap-3 px-6 py-5 border-b dark:border-gray-700">
        <img src="/static/logo.png" alt="Logo" class="w-10 h-10">
        <h1 class="text-lg font-bold text-gray-900 dark:text-gray-100">ML Insight Lab</h1>
      </div>
      <nav class="mt-6 flex flex-col space-y-2 px-4">
        <a href="/" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-blue-100 hover:text-blue-600 dark:hover:bg-blue-900 transition">
          <i class="fas fa-home"></i> Home
        </a>
        <a href="/models" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-blue-100 hover:text-blue-600 dark:hover:bg-blue-900 transition">
          <i class="fas fa-cubes"></i> Models
        </a>
        <a href="/variables" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-blue-100 hover:text-blue-600 dark:hover:bg-blue-900 transition">
          <i class="fas fa-sliders-h"></i> User Variables
        </a>
        <a href="/users" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-blue-100 hover:text-blue-600 dark:hover:bg-blue-900 transition">
          <i class="fas fa-users"></i> User Management
        </a>
      </nav>
    </div>
    <div class="px-4 py-4 border-t dark:border-gray-700 flex justify-between items-center">
      <a href="/logout" class="flex items-center gap-3 px-3 py-2 rounded-lg bg-red-50 text-red-600 hover:bg-red-100 dark:bg-red-900 dark:text-red-300 dark:hover:bg-red-800 transition">
        <i class="fas fa-sign-out-alt"></i> Logout
      </a>
      <!-- Dark Mode Toggle -->
      <button id="theme-toggle" class="p-2 rounded-lg bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 transition">
        <i id="theme-toggle-icon" class="fas fa-moon"></i>
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="flex-1 overflow-y-auto p-8">
    <!-- Dashboard Tiles -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-6 mb-10">
      <div onclick="openInNewWindow('/jupyter')" class="cursor-pointer bg-white dark:bg-gray-800 shadow rounded-2xl p-6 flex flex-col items-center hover:shadow-lg transition">
        <i class="fas fa-book text-3xl text-blue-600"></i>
        <p class="mt-3 font-medium">JupyterHub</p>
      </div>
      <div onclick="openInNewWindow('/mlflow')" class="cursor-pointer bg-white dark:bg-gray-800 shadow rounded-2xl p-6 flex flex-col items-center hover:shadow-lg transition">
        <i class="fas fa-chart-line text-3xl text-green-600"></i>
        <p class="mt-3 font-medium">MLflow</p>
      </div>
      <div onclick="openInNewWindow('/api')" class="cursor-pointer bg-white dark:bg-gray-800 shadow rounded-2xl p-6 flex flex-col items-center hover:shadow-lg transition">
        <i class="fas fa-code text-3xl text-purple-600"></i>
        <p class="mt-3 font-medium">API Documentation</p>
      </div>
    </div>

    <!-- Tab Content (PLACEHOLDER, TODO)-->
    <!--<div class="space-y-8">
      <section id="models" class="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow">
        <h3 class="text-lg font-semibold mb-2">Deployed Models</h3>
        <p class="text-gray-600 dark:text-gray-300">List of deployed models...</p>
      </section>

      <section id="variables" class="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow">
        <h3 class="text-lg font-semibold mb-2">User Variables</h3>
        <p class="text-gray-600 dark:text-gray-300">Manage your variables...</p>
      </section>-->
    </div>
  </main>

  <script>
    // Open links in a new window securely
    function openInNewWindow(url) {
      window.open(url, '_blank', 'noopener,noreferrer');
    }

    // Token validation
    document.addEventListener("DOMContentLoaded", async function() {
      const token = localStorage.getItem('mlil-token');

      if (!token) {
        console.error("No token found, redirecting to login.");
        window.location.href = '/login';
        return;
      }

      try {
        const response = await fetch('/api/users/list', {
          method: 'GET',
          headers: {
            'Authorization': `Bearer ${token}`,
          },
        });

        if (!response.ok) {
          console.error("Token invalid or request failed. Redirecting to login.");
          window.location.href = '/login';
        }
      } catch (error) {
        console.error("Fetch error:", error);
        window.location.href = '/login';
      }
    });

    // Dark mode handling
    const themeToggle = document.getElementById("theme-toggle");
    const themeIcon = document.getElementById("theme-toggle-icon");

    function setTheme(dark) {
      if (dark) {
        document.documentElement.classList.add("dark");
        themeIcon.classList.remove("fa-moon");
        themeIcon.classList.add("fa-sun");
      } else {
        document.documentElement.classList.remove("dark");
        themeIcon.classList.remove("fa-sun");
        themeIcon.classList.add("fa-moon");
      }
    }

    // Initialize based on system preference
    const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
    setTheme(prefersDark);

    themeToggle.addEventListener("click", () => {
      const isDark = document.documentElement.classList.contains("dark");
      setTheme(!isDark);
    });

    // Update theme if system preference changes
    window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", (e) => {
      setTheme(e.matches);
    });
  </script>

</body>
</html>
