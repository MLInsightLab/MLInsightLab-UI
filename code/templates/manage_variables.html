<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ML Insight Lab - Manage Variables</title>
  <link rel="icon" href="/static/logo.png" type="image/png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = { darkMode: 'class' };
  </script>
</head>
<body class="flex h-screen bg-gray-100 text-gray-800 dark:bg-gray-900 dark:text-gray-100">

  <!-- Sidebar -->
  <aside class="w-64 bg-white dark:bg-gray-800 shadow-lg flex flex-col justify-between">
    <div>
      <div class="flex items-center gap-3 px-6 py-5 border-b dark:border-gray-700">
        <img src="/static/logo.png" alt="Logo" class="w-10 h-10">
        <h1 class="text-lg font-bold text-gray-900 dark:text-gray-100">ML Insight Lab</h1>
      </div>
      <nav class="mt-6 flex flex-col space-y-2 px-4">
        <a href="/" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-blue-100 hover:text-blue-600 dark:hover:bg-blue-900 transition">
          <i class="fas fa-home"></i> Home
        </a>
        <a href="/models" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-blue-100 hover:text-blue-600 dark:hover:bg-blue-900 transition">
          <i class="fas fa-cubes"></i> Models
        </a>
        <a href="/variables" class="flex items-center gap-3 px-3 py-2 rounded-lg bg-blue-50 text-blue-600 dark:bg-blue-900 dark:text-blue-300 transition">
          <i class="fas fa-sliders-h"></i> User Variables
        </a>
        <a href="/users" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-blue-100 hover:text-blue-600 dark:hover:bg-blue-900 transition">
          <i class="fas fa-users"></i> User Management
        </a>
      </nav>
    </div>
    <div class="px-4 py-4 border-t dark:border-gray-700 flex justify-between items-center">
      <a href="/logout" class="flex items-center gap-3 px-3 py-2 rounded-lg bg-red-50 text-red-600 hover:bg-red-100 dark:bg-red-900 dark:text-red-300 dark:hover:bg-red-800 transition">
        <i class="fas fa-sign-out-alt"></i> Logout
      </a>
      <button id="theme-toggle" class="p-2 rounded-lg bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 transition">
        <i id="theme-toggle-icon" class="fas fa-moon"></i>
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="flex-1 overflow-y-auto p-8">
    <h1 class="text-2xl font-bold mb-6">Manage User Variables</h1>

    <!-- Set Variable -->
    <section class="bg-white dark:bg-gray-800 rounded-2xl shadow p-6 mb-8">
      <h3 class="text-lg font-semibold mb-4">Set Variable</h3>
      <input id="newVariableName" type="text" placeholder="Variable Name" 
        class="w-full mb-3 px-4 py-2 rounded-lg border border-gray-300 dark:border-gray-600 dark:bg-gray-700 focus:ring-2 focus:ring-blue-500 focus:outline-none">
      <input id="newVariableValue" type="text" placeholder="Variable Value" 
        class="w-full mb-3 px-4 py-2 rounded-lg border border-gray-300 dark:border-gray-600 dark:bg-gray-700 focus:ring-2 focus:ring-blue-500 focus:outline-none">
      <button onclick="setVariable()" 
        class="w-full py-2 px-4 bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-700 transition">
        Set Variable
      </button>
    </section>

    <!-- Variables Table -->
    <section class="bg-white dark:bg-gray-800 rounded-2xl shadow p-6">
      <h3 class="text-lg font-semibold mb-4">Existing Variables</h3>
      <table class="w-full text-left border-collapse">
        <thead>
          <tr class="border-b dark:border-gray-700">
            <th class="py-2">Variable Name</th>
            <th class="py-2">Variable Value</th>
            <th class="py-2">Actions</th>
          </tr>
        </thead>
        <tbody id="variablesTable">
          <tr id="no-variables-row" class="hidden">
            <td colspan="3" class="py-3 text-center text-gray-500 dark:text-gray-400">No variables found.</td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>

  <!-- Toast container -->
  <div id="toast-container" class="fixed top-4 right-4 space-y-2 z-50"></div>

  <script>
    const username = localStorage.getItem('mlil-username');

    // Toast
    function showToast(message, type = "success") {
      const container = document.getElementById("toast-container");
      const toast = document.createElement("div");
      toast.className = `px-4 py-3 rounded-lg shadow text-white ${type === "success" ? "bg-green-600" : "bg-red-600"}`;
      toast.innerText = message;
      container.appendChild(toast);
      setTimeout(() => {
        toast.classList.add("opacity-0", "transition");
        setTimeout(() => toast.remove(), 500);
      }, 3000);
    }

    // Dark mode
    const themeToggle = document.getElementById("theme-toggle");
    const themeIcon = document.getElementById("theme-toggle-icon");
    function setTheme(dark) {
      if (dark) {
        document.documentElement.classList.add("dark");
        themeIcon.classList.replace("fa-moon", "fa-sun");
      } else {
        document.documentElement.classList.remove("dark");
        themeIcon.classList.replace("fa-sun", "fa-moon");
      }
    }
    setTheme(window.matchMedia("(prefers-color-scheme: dark)").matches);
    themeToggle.addEventListener("click", () => setTheme(!document.documentElement.classList.contains("dark")));
    window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", (e) => setTheme(e.matches));

    // Fetch variables
    async function fetchVariables() {
      try {
        const response = await fetch('/api/variable-store/list', {
          headers: { 'Authorization': `Bearer ${localStorage.getItem('mlil-token')}` }
        });
        if (!response.ok) throw new Error('Failed to fetch variables');
        const result = await response.json();
        if (!Array.isArray(result)) throw new Error('Invalid response format');
        const variablesWithValues = await fetchVariableValues(result);
        displayVariables(variablesWithValues);
      } catch (error) {
        showToast(error.message, "error");
      }
    }

    async function fetchVariableValues(variableNames) {
      const variablesWithValues = [];
      for (const variableName of variableNames) {
        try {
          const response = await fetch(`/api/variable-store/get/${variableName}`, {
            headers: { 'Authorization': `Bearer ${localStorage.getItem('mlil-token')}` }
          });
          const result = await response.json();
          variablesWithValues.push({ variable: variableName, variable_value: result || 'No value' });
        } catch {
          console.error(`Error fetching value for ${variableName}`);
        }
      }
      return variablesWithValues;
    }

    function displayVariables(variables) {
      const table = document.getElementById("variablesTable");
      while (table.rows.length > 1) table.deleteRow(1);
      const noRow = document.getElementById("no-variables-row");
      if (!variables || variables.length === 0) {
        noRow.classList.remove("hidden");
        return;
      }
      noRow.classList.add("hidden");

      variables.forEach(varObj => {
        const row = table.insertRow();
        row.innerHTML = `
          <td class="py-2 font-medium">${varObj.variable}</td>
          <td class="py-2">
            <span class="hidden-value">${"•".repeat(20)}</span>
            <button class="ml-2 text-blue-600 hover:underline toggle-visibility">[show]</button>
          </td>
          <td class="py-2 space-x-2">
            <button class="px-2 py-1 bg-gray-200 dark:bg-gray-700 rounded copy-btn">Copy</button>
            <button class="px-2 py-1 bg-red-600 text-white rounded delete-btn">Delete</button>
          </td>
        `;
        const valueContainer = row.querySelector(".hidden-value");
        const toggleBtn = row.querySelector(".toggle-visibility");
        const copyBtn = row.querySelector(".copy-btn");
        const deleteBtn = row.querySelector(".delete-btn");

        toggleBtn.addEventListener("click", () => {
          if (valueContainer.textContent.startsWith("•")) {
            valueContainer.textContent = varObj.variable_value;
            toggleBtn.textContent = "[hide]";
          } else {
            valueContainer.textContent = "•".repeat(20);
            toggleBtn.textContent = "[show]";
          }
        });

        copyBtn.addEventListener("click", () => {
          navigator.clipboard.writeText(varObj.variable_value).then(() => {
            showToast("Copied to clipboard");
          });
        });

        deleteBtn.addEventListener("click", () => deleteVariable(varObj.variable));
      });
    }

    async function setVariable() {
      const name = document.getElementById("newVariableName").value.trim();
      const value = document.getElementById("newVariableValue").value.trim();
      if (!name || !value) {
        showToast("Both fields are required", "error");
        return;
      }
      try {
        const response = await fetch('/api/variable-store/set', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${localStorage.getItem('mlil-token')}` },
          body: JSON.stringify({ username, variable_name: name, value, overwrite: true })
        });
        if (!response.ok) throw new Error("Failed to set variable");
        document.getElementById("newVariableName").value = "";
        document.getElementById("newVariableValue").value = "";
        showToast("Variable set successfully");
        fetchVariables();
      } catch (error) {
        showToast(error.message, "error");
      }
    }

    async function deleteVariable(name) {
      try {
        const response = await fetch(`/api/variable-store/delete/${name}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${localStorage.getItem('mlil-token')}` }
        });
        if (!response.ok) throw new Error("Failed to delete variable");
        showToast("Variable deleted successfully");
        fetchVariables();
      } catch (error) {
        showToast(error.message, "error");
      }
    }

    window.onload = fetchVariables;
  </script>
</body>
</html>
