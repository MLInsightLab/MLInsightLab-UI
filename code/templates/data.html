<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ML Insight Lab</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="/static/css/data.css">
    <link rel="icon" href="/static/logo.png" type="image/png">
</head>

<body>

    <!-- Sidebar Navigation -->
    <div class="sidebar">
        <div>
            <a href="/"><i class="fas fa-home"></i> Home</a>
            <a href="/models"><i class="fas fa-cubes"></i> Models</a>
            <a href="/data"><i class="fas fa-database"></i> Data Store</a>
            <a href="/variables"><i class="fas fa-sliders-h"></i> User Variables</a>
            <a href="/users"><i class="fas fa-users"></i> User Management</a>
        </div>
        <a href="/logout"><i class="fas fa-sign-out-alt"></i> Logout</a>
    </div>

    <!-- Main Content Area -->
    <div class="main-content">
        <div class="content-header">
            <h1>Data Store Management</h1>
        </div>

        <!-- Upload Section -->
        <div class="form-container">
            <h3>Upload File</h3>

            <div id="dropZone" class="drop-zone">
                <p id="dropZoneText">Drag & drop a file here or</p>
                <label for="fileInput" class="custom-file-upload">Choose File</label>
                <p id="fileNameDisplay" class="file-name"></p>
                <input type="file" id="fileInput" style="display: none;">
            </div>

            <button onclick="uploadFile()">Upload</button>
        </div>

        <!-- File Listing Table -->
        <table id="filesTable">
            <thead>
                <tr>
                    <th>Filename</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="filesList">
                <tr>
                    <td colspan="2">No files found.</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- JavaScript Logic -->
    <script>
        let droppedFile = null;

        document.addEventListener("DOMContentLoaded", () => {
            listFiles();

            const dropZone = document.getElementById('dropZone');
            const fileInput = document.getElementById('fileInput');

            dropZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropZone.classList.add('dragover');
            });

            dropZone.addEventListener('dragleave', () => {
                dropZone.classList.remove('dragover');
            });

            dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropZone.classList.remove('dragover');
                const files = e.dataTransfer.files;
                if (files.length > 0) {
                    droppedFile = files[0];
                    fileInput.files = files;
                    document.getElementById('fileNameDisplay').textContent = droppedFile.name;
                }
            });

            fileInput.addEventListener('change', () => {
                droppedFile = fileInput.files[0];
                if (droppedFile) {
                    document.getElementById('fileNameDisplay').textContent = droppedFile.name;
                }
            });
        });

        async function listFiles() {
            try {
                const token = localStorage.getItem('token');
                const response = await fetch('/api/data/list', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ directory: null })
                });

                if (!response.ok) throw new Error('Failed to list files');

                const result = await response.json();
                displayFiles(result);
            } catch (error) {
                alert(error.message);
            }
        }

        function displayFiles(files) {
            const filesList = document.getElementById('filesList');
            filesList.innerHTML = '';

            if (!files.length) {
                filesList.innerHTML = '<tr><td colspan="2">No files found.</td></tr>';
                return;
            }

            files.forEach(file => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${file}</td>
                    <td>
                        <button onclick="downloadFile('${file}')">Download</button>
                    </td>
                `;
                filesList.appendChild(row);
            });
        }

        async function uploadFile() {
            const token = localStorage.getItem('token');
            const file = droppedFile;

            if (!file) return alert('Please select or drop a file');

            const reader = new FileReader();
            reader.onload = async function (event) {
                const base64Data = btoa(event.target.result);
                const data = {
                    filename: file.name,
                    file_bytes: base64Data,
                    overwrite: false
                };

                try {
                    const response = await fetch('/api/data/upload', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                        body: JSON.stringify(data)
                    });

                    if (!response.ok) throw new Error('Failed to upload file');

                    alert('File uploaded successfully');
                    droppedFile = null;
                    document.getElementById('fileInput').value = '';
                    document.getElementById('fileNameDisplay').textContent = '';
                    listFiles();
                } catch (error) {
                    alert(error.message);
                }
            };

            reader.readAsBinaryString(file);
        }

        async function downloadFile(filename) {
            try {
                const token = localStorage.getItem('token');
                const response = await fetch('/api/data/download', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ filename })
                });

                if (!response.ok) throw new Error('Failed to download file');

                const result = await response.json();
                const fileContent = atob(result);
                const binaryArray = new Uint8Array(fileContent.length);
                for (let i = 0; i < fileContent.length; i++) {
                    binaryArray[i] = fileContent.charCodeAt(i);
                }
                const blob = new Blob([binaryArray]);
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = filename;
                link.click();
            } catch (error) {
                alert(error.message);
            }
        }
    </script>

</body>

</html>
