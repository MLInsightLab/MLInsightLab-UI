<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ML Insight Lab - Deployed Models</title>
  <link rel="icon" href="/static/logo.png" type="image/png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = { darkMode: 'class' };
  </script>
</head>
<body class="flex h-screen bg-gray-100 text-gray-800 dark:bg-gray-900 dark:text-gray-100">

  <!-- Sidebar -->
  <aside class="w-64 bg-white dark:bg-gray-800 shadow-lg flex flex-col justify-between">
    <div>
      <div class="flex items-center gap-3 px-6 py-5 border-b dark:border-gray-700">
        <img src="/static/logo.png" alt="Logo" class="w-10 h-10">
        <h1 class="text-lg font-bold text-gray-900 dark:text-gray-100">ML Insight Lab</h1>
      </div>
      <nav class="mt-6 flex flex-col space-y-2 px-4">
        <a href="/" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-blue-100 hover:text-blue-600 dark:hover:bg-blue-900 transition">
          <i class="fas fa-home"></i> Home
        </a>
        <a href="/models" class="flex items-center gap-3 px-3 py-2 rounded-lg bg-blue-50 text-blue-600 dark:bg-blue-900 dark:text-blue-300 transition">
          <i class="fas fa-cubes"></i> Models
        </a>
        <a href="/variables" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-blue-100 hover:text-blue-600 dark:hover:bg-blue-900 transition">
          <i class="fas fa-sliders-h"></i> User Variables
        </a>
        <a href="/users" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-blue-100 hover:text-blue-600 dark:hover:bg-blue-900 transition">
          <i class="fas fa-users"></i> User Management
        </a>
      </nav>
    </div>
    <div class="px-4 py-4 border-t dark:border-gray-700 flex justify-between items-center">
      <a href="/logout" class="flex items-center gap-3 px-3 py-2 rounded-lg bg-red-50 text-red-600 hover:bg-red-100 dark:bg-red-900 dark:text-red-300 dark:hover:bg-red-800 transition">
        <i class="fas fa-sign-out-alt"></i> Logout
      </a>
      <button id="theme-toggle" class="p-2 rounded-lg bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 transition">
        <i id="theme-toggle-icon" class="fas fa-moon"></i>
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="flex-1 overflow-y-auto p-8">
    <h1 class="text-2xl font-bold mb-6">Deployed Models</h1>

    <!-- Search -->
    <div class="mb-4">
      <input id="search-box" type="text" placeholder="Search models..." 
        class="w-full px-4 py-2 rounded-lg border border-gray-300 dark:border-gray-600 dark:bg-gray-700 focus:ring-2 focus:ring-blue-500 focus:outline-none">
    </div>

    <!-- Models Table -->
    <section class="bg-white dark:bg-gray-800 rounded-2xl shadow p-6 mb-6">
      <table class="w-full text-left border-collapse">
        <thead>
          <tr class="border-b dark:border-gray-700">
            <th onclick="sortTable('model_name')" class="py-2 cursor-pointer">Model Name</th>
            <th onclick="sortTable('model_flavor')" class="py-2 cursor-pointer">Flavor</th>
            <th onclick="sortTable('model_version_or_alias')" class="py-2 cursor-pointer">Version/Alias</th>
            <th class="py-2">Actions</th>
          </tr>
        </thead>
        <tbody id="models-table"></tbody>
      </table>
    </section>

    <!-- Restart Buttons -->
    <div class="flex gap-4">
      <button onclick="restartJupyter()" class="flex-1 py-2 px-4 bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-700 transition">
        Restart Jupyter
      </button>
      <button onclick="resetDeployment()" class="flex-1 py-2 px-4 bg-red-600 text-white font-semibold rounded-lg hover:bg-red-700 transition">
        Restart Deployment Server
      </button>
    </div>
  </main>

  <!-- Toast container -->
  <div id="toast-container" class="fixed top-4 right-4 space-y-2 z-50"></div>

  <script>
    let modelsData = [];
    let currentSortField = '';
    let currentSortOrder = 'asc';

    function showToast(message, type = "success") {
      const container = document.getElementById("toast-container");
      const toast = document.createElement("div");
      toast.className = `px-4 py-3 rounded-lg shadow text-white ${type === "success" ? "bg-green-600" : "bg-red-600"}`;
      toast.innerText = message;
      container.appendChild(toast);
      setTimeout(() => {
        toast.classList.add("opacity-0", "transition");
        setTimeout(() => toast.remove(), 500);
      }, 3000);
    }

    // Dark mode
    const themeToggle = document.getElementById("theme-toggle");
    const themeIcon = document.getElementById("theme-toggle-icon");
    function setTheme(dark) {
      if (dark) {
        document.documentElement.classList.add("dark");
        themeIcon.classList.replace("fa-moon", "fa-sun");
      } else {
        document.documentElement.classList.remove("dark");
        themeIcon.classList.replace("fa-sun", "fa-moon");
      }
    }
    setTheme(window.matchMedia("(prefers-color-scheme: dark)").matches);
    themeToggle.addEventListener("click", () => setTheme(!document.documentElement.classList.contains("dark")));
    window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", (e) => setTheme(e.matches));

    // Fetch models
    async function fetchModels() {
      const token = localStorage.getItem('mlil-token');
      if (!token) { window.location.href = '/login'; return; }
      try {
        const response = await fetch('/api/models/list', { headers: { 'Authorization': `Bearer ${token}` } });
        if (response.ok) {
          modelsData = await response.json();
          populateModelsTable(modelsData);
        } else if (response.status === 401) {
          window.location.href = '/login';
        } else {
          showToast("Failed to fetch models", "error");
        }
      } catch {
        showToast("An error occurred fetching models", "error");
      }
    }

    function populateModelsTable(models) {
      const table = document.getElementById("models-table");
      table.innerHTML = "";
      if (models.length === 0) {
        const row = table.insertRow();
        const cell = row.insertCell(0);
        cell.colSpan = 4;
        cell.className = "py-4 text-center text-gray-500 dark:text-gray-400";
        cell.innerText = "No deployed models found.";
        return;
      }
      models.forEach(model => {
        const row = table.insertRow();
        row.innerHTML = `
          <td class="py-2">${model.model_name}</td>
          <td class="py-2">${model.model_flavor}</td>
          <td class="py-2">${model.model_version_or_alias}</td>
          <td class="py-2">
            <button class="px-3 py-1 bg-red-600 text-white rounded hover:bg-red-700 transition">Remove</button>
          </td>
        `;
        row.querySelector("button").addEventListener("click", () => removeModel(model.model_name, model.model_flavor, model.model_version_or_alias));
      });
    }

    document.getElementById("search-box").addEventListener("input", function() {
      const query = this.value.toLowerCase();
      const filtered = modelsData.filter(m =>
        m.model_name.toLowerCase().includes(query) ||
        m.model_flavor.toLowerCase().includes(query) ||
        m.model_version_or_alias.toLowerCase().includes(query)
      );
      populateModelsTable(filtered);
    });

    function sortTable(field) {
      if (currentSortField === field) {
        currentSortOrder = currentSortOrder === 'asc' ? 'desc' : 'asc';
      } else {
        currentSortField = field;
        currentSortOrder = 'asc';
      }
      modelsData.sort((a, b) => {
        let valA = a[field].toLowerCase();
        let valB = b[field].toLowerCase();
        if (valA < valB) return currentSortOrder === 'asc' ? -1 : 1;
        if (valA > valB) return currentSortOrder === 'asc' ? 1 : -1;
        return 0;
      });
      populateModelsTable(modelsData);
    }

    async function removeModel(name, flavor, version) {
      const token = localStorage.getItem('mlil-token');
      if (!confirm(`Remove model '${name}'?`)) return;
      try {
        const response = await fetch(`/api/models/undeploy/${name}/${flavor}/${version}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (response.ok) {
          showToast(`Model '${name}' removed`);
          fetchModels();
        } else {
          showToast("Failed to remove model", "error");
        }
      } catch {
        showToast("Error removing model", "error");
      }
    }

    async function restartJupyter() {
      const token = localStorage.getItem('mlil-token');
      try {
        const response = await fetch('/api/restart-jupyter', { headers: { 'Authorization': `Bearer ${token}` } });
        if (response.ok) {
          showToast("Jupyter restarted successfully");
        } else {
          showToast("Failed to restart Jupyter", "error");
        }
      } catch {
        showToast("Error restarting Jupyter", "error");
      }
    }

    async function resetDeployment() {
      const token = localStorage.getItem('mlil-token');
      try {
        const response = await fetch('/api/reset', { headers: { 'Authorization': `Bearer ${token}` } });
        if (response.ok) {
          showToast("Deployment server restarted");
        } else {
          showToast("Failed to restart deployment server", "error");
        }
      } catch {
        showToast("Error restarting deployment server", "error");
      }
    }

    window.onload = fetchModels;
  </script>
</body>
</html>
